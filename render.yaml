services:
  - type: web
    name: job-research
    env: docker
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeploy: true
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: CORS_ORIGIN
        value: "https://mon-application-job.onrender.com"
        sync: false
      - key: FRONTEND_URL
        value: "https://mon-application-job.onrender.com"
        sync: false
      - key: DB_HOST
        value: "102.179.222.45"
        sync: false
        # Exemple: db.example.com (MySQL externe, pas localhost)
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: "bddiane_sp"
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: FILE_SIGNATURE_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: UPLOAD_DIR
        value: /tmp/uploads

